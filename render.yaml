services:
  - type: web
    name: protein-structure-comparison
    env: python
    plan: starter  # Upgraded from free - required for ML dependencies
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python backend_server.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_PORT
        value: 5001
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: RENDER
        value: "true"
    # Resource requirements for ML models
    disk:
      sizeGB: 20  # Space for model downloads
    domains:
      - protein-structure-comparison.onrender.com
    # Note: Starter plan ($7/month) minimum required for:
    # - PyTorch, Transformers, ESM models
    # - Sufficient memory for ML inference
    # - Faster build times for large dependencies